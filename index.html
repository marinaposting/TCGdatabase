<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Database</title>
  <style>
  
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; 
    background-color: rgba(0,0,4,0.9);
    background-blend-mode: multiply;
     background-image: url('https://github.com/marinaposting/TCGdatabase/blob/main/cards/background.jpg?raw=true');
     background-position: center top;
     background-repeat: no-repeat;
     background-size: contain;
     background-attachment: fixed;
    }
    h1 { text-align: center; margin-bottom: 20px; }
    #search { width: 100%; max-width: 500px; display: block; margin: 0 auto 24px auto; padding: 12px; font-size: 16px; border-radius: 6px; border: none; box-sizing: border-box; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 600px) {.grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
    .card {background: #1e1e1e; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid #333; position: relative; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card:hover {transform: scale(1.15); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
    .card img { width: 100%; height: auto; border-radius: 6px; display: block; }
    .card h3 { font-size: 15px; margin: 10px 0 0 0; } /* Removed bottom margin since the set number is gone */
  </style>
</head>

<body>

  <h1>Card Database</h1>
  <div id="controls" style="display: flex; gap: 10px; max-width: 600px; margin: 0 auto 24px auto; justify-content: center;"> <input type="text" id="search" placeholder="Search cards by name..." onkeyup="applyFilterAndSort()" style="flex: 1; padding: 12px; border-radius: 6px; border: none;"> <select id="sort" onchange="applyFilterAndSort()" style="padding: 8px; border-radius: 10px; border: 1px solid; background: #333; color: white; height: 42px"> <option value="name-asc">Name (A-Z)</option> <option value="name-desc">Name (Z-A)</option> <option value="num-asc">Fuel (Low to High)</option> <option value="num-desc">Fuel (High to Low)</option> <option value="text-asc">Unit Type (A-Z)</option> </select> </div>
  <div class="grid" id="card-grid"></div>

  <script>
    let cards = [];

    // Fetch card data from the JSON file
    fetch('cards.json')
      .then(res => res.json())
      .then(data => { 
        cards = data; 
        renderCards(cards); 
      })
      .catch(err => console.error("Could not load cards.json:", err));

    function renderCards(data) {
      const grid = document.getElementById('card-grid');
      grid.innerHTML = data.map(c => `
        <a href="card.html?name=${encodeURIComponent(c.NAME)}" style="text-decoration: none; color: inherit;">
          <div class="card">
            <img src="${c.IMAGE}" alt="${c.NAME}">
            <h3>${c.NAME} - ${c["CARD TYPE"]}</h3>
          </div>
        </a>
      `).join('');
        }
    
    function applyFilterAndSort() {
      const query = document.getElementById('search').value.toLowerCase();
      const sortOption = document.getElementById('sort').value;
      // 1. First, filter the cards by the search bar
      let filteredAndSorted = cards.filter(c => c.NAME.toLowerCase().includes(query));
      // 2. Then, sort the remaining cards based on the dropdown
        filteredAndSorted.sort((a, b) => {
        if (sortOption === 'name-asc') return a.NAME.localeCompare(b.NAME);
        if (sortOption === 'name-desc') return b.NAME.localeCompare(a.NAME);
        // Change 'COST' to whatever your number column is named in your JSON
        if (sortOption === 'num-asc') return (Number(a["FUEL RQ."]) || 0) - (Number(b["FUEL RQ."]) || 0);
        if (sortOption === 'num-desc') return (Number(b["FUEL RQ."]) || 0) - (Number(a["FUEL RQ."]) || 0);
        // Change 'TYPE' to whatever your text/category column is named
        if (sortOption === 'text-asc') return (a["CARD TYPE"] || "").localeCompare(b["CARD TYPE"] || "");
        return 0;
      });
      // 3. Render the updated list
      renderCards(filteredAndSorted);
    }

  </script>
</body>
</html>
