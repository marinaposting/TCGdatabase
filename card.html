<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Details</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #121212; 
      color: #e0e0e0; 
      padding: 20px; 
      margin: 0;
      background-color: rgba(0,0,4,0.9);
      background-blend-mode: multiply;
      background-image: url('https://github.com/marinaposting/TCGdatabase/blob/main/cards/background.jpg?raw=true');
      background-position: center top;
      background-repeat: no-repeat;
      background-size: contain fixed; 
    }
    .nav { max-width: 1000px; margin: 0 auto 20px auto; }
    .nav a { color: #4da6ff; text-decoration: none; font-size: 16px; }
    .nav a:hover { text-decoration: underline; }
    
    .container { display: flex; flex-wrap: wrap; gap: 40px; max-width: 1000px; margin: 0 auto; }
    .left-col { flex: 1; min-width: 300px; }
    .left-col img { width: 100%; max-width: 450px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); display: block; }
    
    .right-col { flex: 1.5; min-width: 300px; background: #1e1e1e; padding: 24px; border-radius: 8px; border: 1px solid #333; }
    .right-col h1 { margin: 0 0 5px 0; color: #fff; }
    
    .subtitle { font-size: 18px; color: #aaa; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #444; }
    .sub-details { font-size: 14px; color: #888; margin-top: 6px; }
    
    .stat-block { margin-bottom: 20px; }
    .label { font-weight: bold; color: #fff; display: block; margin-bottom: 4px; }
    .text-box { background: #2a2a2a; padding: 12px; border-radius: 6px; line-height: 1.5; }
    .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border-top: 1px solid #444; padding-top: 20px; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="nav">
    <a href="javascript:history.back()">&larr; Back to Database</a>
  </div>

  <div class="container" id="card-container">
    <p>Loading card data...</p>
  </div>

  <script>
    // 1. Get the card name from the URL
    const params = new URLSearchParams(window.location.search);
    const cardName = params.get('name');

    if (!cardName) {
      document.getElementById('card-container').innerHTML = "<p>No card specified.</p>";
    } else {
      // 2. Fetch the JSON and find the matching card
      fetch('cards.json')
        .then(res => res.json())
        .then(data => {
          const card = data.find(c => c.NAME === cardName);
          if (card) renderCard(card);
          else document.getElementById('card-container').innerHTML = "<p>Card not found.</p>";
        })
        .catch(err => console.error(err));
    }

    // Helper to parse title (first line) and body text (remaining lines)
    function parseEffect(text) {
      if (!text || text.toLowerCase() === "n/a") return null;
      
      const lines = text.split('\n');
      const name = lines[0].trim();
      const body = lines.slice(1).join('&nbsp;').trim();
      
      return {
        name: name,
        body: body.length > 0 ? body : null
      };
    }

    // Renders the stat block dynamically
    function renderStatBlock(title, rawText) {
      const effect = parseEffect(rawText);
      if (!effect) return '';

      let html = `<div class="stat-block">`;
      html += `<span class="label">${title}: ${effect.name}</span>`;
      
      // Render the text box only if description body exists
      if (effect.body) {
        html += `<div class="text-box">${effect.body}</div>`;
      }
      
      html += `</div>`;
      return html;
    }

    // 3. Build the HTML layout
    function renderCard(c) {
      let html = `<div class="left-col"><img src="${c.IMAGE}" alt="${c.NAME}"></div>`;
      
      html += `<div class="right-col">`;
      html += `<h1>${c.NAME}</h1>`;
      
      // Sub-type & Category check
      const subType = (c["sub-type"] && c["sub-type"].toLowerCase() !== "n/a") ? c["sub-type"] : null;
      const category = (c["category"] && c["category"].toLowerCase() !== "n/a") ? c["category"] : null;
      const extraDetails = [subType, category].filter(Boolean).join(" • ");

      html += `<div class="subtitle">`;
      html += `<div>${c["CARD TYPE"]} - ${c["HEALTH POINTS"]} | ${c.RARITY}</div>`;
      if (extraDetails) {
        html += `<div class="sub-details">${extraDetails}</div>`;
      }
      html += `</div>`;

      // Render Abilities and Attacks dynamically
      html += renderStatBlock("Ability 1", c["ABILITY 1"]);
      html += renderStatBlock("Ability 2", c["ABILITY 2"]);
      html += renderStatBlock("Attack 1", c["ATTACK 1"]);
      html += renderStatBlock("Attack 2", c["ATTACK 2"]);

      // Bottom meta grid for smaller stats
      html += `<div class="meta-grid">`;
      html += `<div><span class="label">Fuel Required:</span> ${c["FUEL RQ."]}</div>`;
      
      const stanceText = (c.STANCE && c.STANCE.toLowerCase() !== "n/a") ? c.STANCE.replace(/\n/g, ' ') : "None";
      html += `<div><span class="label">Stance:</span> ${stanceText}</div>`;
      
      if (c.artist && c.artist !== "n/a" && !c.artist.includes("unknown")) {
        html += `<div style="grid-column: span 2; margin-top: 10px;">
                   <span class="label">Artist:</span> <a href="${c.artist}" target="_blank" style="color: #4da6ff;">${c.artist}</a>
                 </div>`;
      }
      
      html += `</div></div>`; // Close meta-grid and right-col
      
      document.getElementById('card-container').innerHTML = html;
    }
  </script>
</body>
</html>
